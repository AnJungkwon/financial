<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2433">
<meta name="referrer" content="no-referrer">
<title>가족 자산</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <h1 class="brand">가족 자산</h1>
  <nav class="tabs" id="tabs" role="tablist" aria-label="매수 주체"></nav>
  <div class="actions">
    <span class="updated" id="updated"></span>
    <button class="btn primary" id="btnRefresh" type="button">↻ 시세 갱신</button>
    <button class="btn icon mobile-only" id="btnAddTop" type="button" data-action="add" aria-label="종목 등록">＋</button>
    <button class="btn icon" id="btnMenu" type="button" aria-label="메뉴">⋯</button>
  </div>
</header>

<main>
  <section class="cards" id="cards" aria-label="요약"></section>
  <p class="notice" id="notice" hidden></p>

  <div class="table-wrap" id="tableWrap">
    <table class="grid" id="grid">
      <thead></thead>
      <tbody></tbody>
      <tfoot></tfoot>
    </table>
  </div>

  <div class="empty" id="empty" hidden>
    <p>등록된 자산이 없습니다.</p>
    <button class="btn primary" type="button" data-action="add">+ 첫 종목 등록하기</button>
  </div>
</main>

<button class="fab" id="btnAdd" type="button" data-action="add">+ 종목 등록</button>

<!-- 종목 등록 / 추가 매수 -->
<dialog id="dlgTx">
  <form method="dialog" id="formTx" novalidate>
    <h2 id="txTitle">종목 등록</h2>
    <div class="form-grid">
      <label>매수 주체<select id="fOwner" required></select></label>
      <label>계좌유형<select id="fAcct" required></select></label>
      <label class="span2"><span>증권사 <small>(선택)</small></span><input id="fBroker" autocomplete="off" placeholder="예: 미래에셋"></label>
      <label>종목코드<input id="fCode" required autocomplete="off" list="codeList" placeholder="예: 005930" inputmode="text"></label>
      <label>유형<select id="fType">
        <option value="STOCK">주식</option><option value="ETF">ETF</option><option value="FUND">펀드</option>
      </select></label>
      <label class="span2">종목명<input id="fName" required autocomplete="off" placeholder="예: 삼성전자"></label>
      <label><span>수량 <small id="qtyUnit">(주)</small></span><input id="fQty" required type="number" min="0" step="any" inputmode="decimal"></label>
      <label><span>매수단가 <small id="priceUnit">(원)</small></span><input id="fPrice" required type="number" min="0" step="any" inputmode="decimal"></label>
      <label class="span2">매수일<input id="fDate" type="date"></label>
    </div>
    <p class="hint" id="txHint"></p>
    <p class="error" id="txError" role="alert"></p>

    <details id="txHistory" hidden>
      <summary>거래 내역 <span id="txCount"></span></summary>
      <ul class="tx-list" id="txList"></ul>
      <button class="btn danger small" type="button" id="btnDelHolding">이 종목 전체 삭제</button>
    </details>

    <div class="dlg-actions">
      <button class="btn" type="button" data-close>취소</button>
      <button class="btn primary" type="submit" id="txSubmit">등록</button>
    </div>
  </form>
</dialog>
<datalist id="codeList"></datalist>

<!-- 단일 종목 시세 입력 -->
<dialog id="dlgPrice">
  <form method="dialog" id="formPrice" novalidate>
    <h2>시세 입력 <small id="priceTarget"></small></h2>
    <div class="form-grid">
      <label>현재가<input id="pPrice" type="number" min="0" step="any" inputmode="decimal" required></label>
      <label>전일종가<input id="pPrev" type="number" min="0" step="any" inputmode="decimal"></label>
    </div>
    <p class="hint" id="priceHint"></p>
    <p class="error" id="priceError" role="alert"></p>
    <div class="dlg-actions">
      <button class="btn" type="button" data-close>취소</button>
      <button class="btn primary" type="submit">저장</button>
    </div>
  </form>
</dialog>

<!-- 시세 일괄 입력 -->
<dialog id="dlgBulk">
  <form method="dialog" id="formBulk" novalidate>
    <h2>시세 일괄 입력</h2>
    <p class="hint">한 줄에 <code>종목코드 현재가 전일종가</code>. <code>#</code> 뒤는 메모입니다. 전일종가를 비우면 일일손익은 표시되지 않습니다.
      펀드는 1,000좌당 기준가를 입력하세요.</p>
    <textarea id="bulkText" rows="10" spellcheck="false"></textarea>
    <p class="error" id="bulkError" role="alert"></p>
    <div class="dlg-actions">
      <button class="btn" type="button" data-close>취소</button>
      <button class="btn primary" type="submit">적용</button>
    </div>
  </form>
</dialog>

<!-- 메뉴 -->
<dialog id="dlgMenu">
  <form method="dialog">
    <h2>설정 · 백업</h2>
    <div class="menu-section">
      <h3>시세 소스</h3>
      <select id="mSource"></select>
      <label class="check"><input type="checkbox" id="mAuto"> 장중(평일 09:00~15:30) 1분마다 자동 갱신</label>
      <p class="hint" id="mSourceHint"></p>
    </div>
    <div class="menu-section">
      <h3>백업 · 이전 (PC ↔ 폰)</h3>
      <div class="btn-row">
        <button class="btn" type="button" id="mExport">백업 파일 저장 (.json)</button>
        <button class="btn" type="button" id="mImport">백업 불러오기</button>
        <button class="btn" type="button" id="mCsv">현재 표 CSV 저장</button>
      </div>
      <input type="file" id="mFile" accept=".json,application/json" hidden>
      <p class="hint">데이터는 이 기기의 브라우저에만 저장됩니다. 브라우저 데이터를 지우면 함께 삭제되니 백업 파일을 주기적으로 저장하세요.</p>
    </div>
    <div class="dlg-actions">
      <button class="btn" type="button" data-close>닫기</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/calc.js"></script>
<script src="js/db.js"></script>
<script src="js/prices.js"></script>
<script src="js/app.js"></script>
</body>
</html>
